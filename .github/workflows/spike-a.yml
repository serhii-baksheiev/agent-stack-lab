name: Spike A experiments
on:
  push:
    branches: [spike/a-spec-kit-manifest]
    paths: ['scripts/baseline.mjs', 'scripts/lab-evidence.mjs', '.github/workflows/spike-a.yml']
  workflow_dispatch:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
        description: Hosted OS or optional existing self-hosted label
jobs:
  baseline:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-a-evidence
          path: spikes/a-spec-kit-manifest/evidence/
