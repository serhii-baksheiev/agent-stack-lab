name: Laboratory validation
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (self-hosted lane is optional)'
        default: ubuntu-latest
        type: string
jobs:
  smoke:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate.mjs > validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: validation.log
